# chezmoi:template:left-delimiter="# {{" right-delimiter=}}

# {{ if eq .chezmoi.os "darwin" -}}

[".config/sketchybar/external/sketchybar-app-font"]
type = "git-repo"
url = "https://github.com/kvndrsslr/sketchybar-app-font.git"
refreshPeriod = "168h"

[".config/sketchybar/external/sketchybar-app-font"."pull"]
args = ["--rebase", "--autostash"]

[".config/ghostty/shaders/cursors"]
type = "git-repo"
url = "https://github.com/sahaj-b/ghostty-cursor-shaders.git"
refreshPeriod = "168h"

[".config/ghostty/shaders/cursors"."pull"]
args = ["--rebase", "--autostash"]

# {{ end -}}

[".local/share/tolaria-mcp"]
type = "archive"
# {{ with gitHubLatestRelease "refactoringhq/tolaria" -}}
url = "https://github.com/refactoringhq/tolaria/archive/refs/tags/# {{ .TagName }}.tar.gz"
# {{ end -}}
stripComponents = 1
include = ["*/mcp-server/**", "*/src", "*/src/utils", "*/src/utils/typeInstanceDefaults.mjs"]
refreshPeriod = "168h"
